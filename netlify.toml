# CI-02: o build do próprio Netlify roda só compilação (sem os testes) — o ambiente de build dele
# não resolve o binário do vitest do workspace "server" (mesmo com devDependencies instaladas),
# um problema específico da imagem de build que não reproduz local nem no GitHub Actions. Os testes
# continuam rodando automaticamente em dois lugares que funcionam de verdade: a cada push/PR via
# .github/workflows/ci.yml, e localmente antes de todo `npm run deploy` (que chama build:all, com
# testes, antes do netlify deploy). Ver histórico de builds do site pra contexto se isso mudar.
[build]
  command = "npm run build:server && npm run build:web"
  publish = "web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /api/* PRECISA vir antes do fallback do SPA (Netlify avalia redirects na ordem, primeiro match vence).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
